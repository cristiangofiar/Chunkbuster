name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false

      - name: Test
        run: |
          uv sync --locked --dev
          uv run pytest
          uv run ruff check .

      - name: Build
        run: uv build --no-sources

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish