[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunkbuster"
version = "0.2.2"
description = "Composable tree classification and retrieval pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/chunkbuster"]

[tool.hatch.build.targets.sdist]
exclude = ["/playground"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  "ignore:.*get_event_loop_policy.*:DeprecationWarning:pytest_asyncio\\..*",
  "ignore:.*set_event_loop_policy.*:DeprecationWarning:pytest_asyncio\\..*",
]
testpaths = [
  "tests/core",
  "tests/tree_classification",
  "tests/retrieval",
]
